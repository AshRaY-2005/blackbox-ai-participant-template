name: Hypothesis
description: A claim about the hidden system that you intend to test.
title: "[HYPOTHESIS] "
labels: ["hypothesis"]
body:
  - type: markdown
    attributes:
      value: "Open one of these *before* you spend queries testing it. Judges read these to see how you thought, not just what you concluded."
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State it so that it could be proven wrong.
      placeholder: "x3 is ignored entirely by the pipeline."
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why do we believe this?
      description: What have you already seen that suggests it?
    validations: { required: true }
  - type: textarea
    id: experiment
    attributes:
      label: Experiment that would test it
      description: What inputs will you send, and what will you compare?
    validations: { required: true }
  - type: input
    id: cost
    attributes:
      label: Queries this will cost
      placeholder: "8"
    validations: { required: true }
  - type: textarea
    id: alternative
    attributes:
      label: Alternative explanation
      description: What else could produce the same observation? This is the most valuable box on the form.
    validations: { required: true }
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence before testing
      options: ["Low — a guess", "Medium — consistent with what we've seen", "High — we expect to confirm it"]
    validations: { required: true }
