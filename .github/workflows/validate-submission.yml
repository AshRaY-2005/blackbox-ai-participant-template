name: Validate submission

# Runs the pull request's own files through tools/validate.py. Pull requests come from
# forks, so this runs with a read-only token and cannot label or comment: the result is
# the check itself, with the details in its summary (Details -> Summary). Labels and the
# Team ID reminder come from triage.yml, which never runs anything from a pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate findings and structure
        id: validate
        run: |
          set +e
          python tools/validate.py 2>&1 | tee /tmp/validate.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check no credentials are committed
        id: creds
        run: |
          set +e
          hits=$(git ls-files | grep -Ei '(^|/)(\.env|token\.txt|credentials)')
          if [ -n "$hits" ]; then
            echo "$hits" > /tmp/creds.txt
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.creds.outputs.found }}" = "1" ]; then
              echo "### Credentials detected — fix this before anything else"
              echo
              echo "These tracked files look like credentials. Your fork is public, so treat"
              echo "them as already seen: remove them and ask the registration desk for a new"
              echo "team password."
              echo
              echo '```'
              cat /tmp/creds.txt
              echo '```'
              echo
            fi
            if [ "${{ steps.validate.outputs.code }}" = "0" ]; then
              echo "### Submission checks passed"
              echo
              echo "Your \`findings.json\` is well formed. This does **not** mean your claims are"
              echo "correct — only that judges can read them."
            else
              echo "### Submission checks failed"
              echo
              echo "Fix these and push again to the same branch."
            fi
            echo
            echo '```'
            cat /tmp/validate.txt 2>/dev/null || echo "(validation did not run - see the log)"
            echo '```'
            echo
            echo "Reminder: this pull request **is** your submission. Judges mark the commit it"
            echo "is at when the organisers end the round; anything pushed afterwards is not."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if checks did not pass
        if: steps.validate.outputs.code != '0' || steps.creds.outputs.found == '1'
        run: exit 1
